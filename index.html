<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayangnya, Aku</title>
  <meta name="description" content="Surat kecil tentang hal yang ingin kusampaikan." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/main.css" />
</head>
<body>
<canvas id="canvas-grain"></canvas>
<div id="intro-screen">
  <div class="tw-stage">
    <div id="tw-output"><span class="tw-cursor" id="tw-cursor">_</span></div>
    <div id="intro-enter" class="hidden">
      <button id="masuk-btn" class="btn-masuk">buka</button>
    </div>
  </div>
</div>
<div id="main-experience" class="hidden">
  <div id="music-pill">
    <button id="bgm-btn" class="music-btn" aria-label="Putar atau hentikan musik">
      <span id="bgm-icon">&#9835;</span>
    </button>
  </div>
  <section id="s-hero" class="s-hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h1 class="h-line h-l1">Sayangnya,</h1>
        <p class="h-line h-l2 h-italic">aku.</p>
        <div class="h-divider"></div>
        <p class="h-sub">Ada hal yang sudah lama ingin kusampaikan.</p>
      </div>
      <div class="hero-scroll">
        <span class="scroll-label">gulir ke bawah</span>
        <div class="scroll-line"></div>
      </div>
    </div>
  </section>
  <section id="s-awal" class="section">
    <div class="section-inner">
      <div class="section-tag">
        <span class="tag-num">01</span>
        <span class="tag-label" id="label-ch1"></span>
      </div>
      <p class="intro-quote" id="intro-ch1"></p>
      <div id="timeline-container" class="timeline"></div>
    </div>
  </section>
  <section id="s-maaf" class="section section-alt">
    <div class="section-inner">
      <div class="section-tag">
        <span class="tag-num">02</span>
        <span class="tag-label" id="label-ch2"></span>
      </div>
      <p class="intro-quote" id="intro-ch2"></p>
      <div id="apologies-container" class="apologies-list"></div>
      <p class="apologies-closing" id="apologies-closing"></p>
    </div>
  </section>
  <section id="s-kenangan" class="section">
    <div class="section-inner">
      <div class="section-tag">
        <span class="tag-num">03</span>
        <span class="tag-label" id="label-ch3"></span>
      </div>
      <p class="intro-quote" id="intro-ch3"></p>
      <div id="observations-container" class="observations-list"></div>
      <div class="photos-header">
        <span class="photos-label">Foto-foto yang kusimpan</span>
      </div>
      <div id="photos-container" class="photos-grid"></div>
    </div>
  </section>
  <section id="s-penutup" class="section section-dark">
    <div class="section-inner">
      <div class="section-tag">
        <span class="tag-num">04</span>
        <span class="tag-label" id="label-ch4"></span>
      </div>
      <div id="teaser-container" class="teaser-block"></div>
      <div class="btn-letter-wrap">
        <button id="open-letter-btn" class="btn-open-letter">baca suratnya</button>
      </div>
    </div>
  </section>
  <footer class="site-footer">
    <p class="footer-sig">&mdash; Hilya &#129293;</p>
  </footer>
</div>
<div id="lightbox" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="lightbox-card">
    <button id="lb-close" class="modal-close" aria-label="Tutup">&times;</button>
    <div class="lb-img-wrap"><img id="lb-img" src="" alt="Foto kenangan" /></div>
    <div class="lb-caption-wrap">
      <span id="lb-num" class="lb-num"></span>
      <p id="lb-note" class="lb-note"></p>
    </div>
  </div>
</div>
<div id="letter-modal" class="modal-overlay letter-overlay hidden" role="dialog" aria-modal="true">
  <div class="letter-wrap">
    <button id="letter-close" class="letter-x">&times;</button>
    <div class="letter-paper">
      <p class="letter-salutation" id="letter-salutation"></p>
      <div class="letter-body" id="letter-body"></div>
      <div class="letter-closing-row">
        <p class="letter-closing-text" id="letter-closing"></p>
        <p class="letter-sender" id="letter-sender"></p>
      </div>
      <div class="letter-done-wrap">
        <button id="letter-done-btn" class="btn-done">selesai membaca</button>
      </div>
    </div>
  </div>
</div>
<div id="final-ending" class="hidden" aria-live="polite">
  <div class="ending-inner">
    <p class="e-line" id="e1"></p>
    <p class="e-line" id="e2"></p>
    <div class="e-rule"></div>
    <p class="e-line e-final" id="e3"></p>
    <p class="e-sig">&mdash; Hilya &#129293;</p>
    <div class="e-replay-wrap" id="e-replay">
      <button id="e-replay-btn" class="e-replay-btn" type="button">baca kembali</button>
    </div>
  </div>
</div>
<script type="module" src="./src/js/app.js"></script>
</body>
</html>
